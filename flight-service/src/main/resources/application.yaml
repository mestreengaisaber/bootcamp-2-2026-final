spring:
  application:
    name: flight-service
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:mem:flightdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      jakarta:
        persistence:
          lock:
            timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: flight-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # OJO: sin spring.json.value.default.type aqui. Los productores del proyecto
        # (OutboxRelay envia JSON plano) no anaden cabeceras de tipo, y flight consume
        # DOS tipos (booking.created y booking.cancelled). El default.type se fija
        # POR-LISTENER via la propiedad 'properties' de @KafkaListener (paso listeners).
        spring.json.trusted.packages: "*"

server:
  port: 8086
