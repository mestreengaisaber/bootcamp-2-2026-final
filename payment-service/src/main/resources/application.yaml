spring:
  application:
    name: payment-service
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:mem:paydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      jakarta:
        persistence:
          lock:
            timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: dakota.software.paymentservice.application.event.BookingCreatedEvent
        spring.json.trusted.packages: "*"
app:
  stripe-key: key-strilape0001
  paypal-key: key-paypal0002
  fail-payments: false
server:
  port: 8083