global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # Los micros corren en Docker en la red 'observability'.
  # Los nombres de servicio resuelven dentro de la red Docker.
  # Requieren actuator con /actuator/prometheus (micrometer-registry-prometheus).
  - job_name: 'microservices'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'booking-service:8082'
          - 'payment-service:8083'
          - 'checkin-service:8084'
          - 'flight-service:8086'
          - 'auth-service:8087'
