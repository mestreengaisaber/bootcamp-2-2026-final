spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/bootcamp_auth
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none

server:
  port: 8087